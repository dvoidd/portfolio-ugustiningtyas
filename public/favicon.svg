<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7c3aed" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Dark glassmorphic background -->
  <rect width="64" height="64" rx="16" fill="#121019"/>
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="url(#glowGrad)" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Code / Terminal Bracket Symbol < / > -->
  <g filter="url(#shadow)" stroke="url(#glowGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left bracket < -->
    <path d="M 22 22 L 14 32 L 22 42" />
    <!-- Forward slash / -->
    <path d="M 36 20 L 28 44" />
    <!-- Right bracket > -->
    <path d="M 42 22 L 50 32 L 42 42" />
  </g>
</svg>
